# Render Blueprint for the API. In Render: New → Blueprint → pick this repo.
# Secrets marked sync:false are entered in the Render dashboard, not committed.
services:
  - type: web
    name: k12-hunar-crm-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
